name: Publish to MCP Registry

on:
  push:
    branches:
      - main
    paths:
      - server.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # required for GitHub OIDC auth

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher CLI
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            -o mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Login with GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry (auto-increment patch on duplicate)
        run: |
          # Try publish; if duplicate version, bump patch and retry once
          if ! mcp-publisher publish 2>&1 | tee /tmp/pub.log; then
            if grep -q 'duplicate version' /tmp/pub.log; then
              echo "Duplicate version detected — bumping patch version"
              VERSION=$(jq -r .version server.json)
              MAJOR=$(echo $VERSION | cut -d. -f1)
              MINOR=$(echo $VERSION | cut -d. -f2)
              PATCH=$(echo $VERSION | cut -d. -f3)
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
              echo "Bumping $VERSION -> $NEW_VERSION"
              jq --arg v "$NEW_VERSION" '.version = $v' server.json > server.json.tmp && mv server.json.tmp server.json
              mcp-publisher publish
            else
              cat /tmp/pub.log
              exit 1
            fi
          fi
